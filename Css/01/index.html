<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet </title>
   <!--  CSS embedde (embutido) -->
   <style>  p{font-size: 200px ;}
     #gato{ color: yellowgreen;}
     #cachorro {color: palevioletred; }
</style>
</head>
<body>

  <p  style=" color:rebeccapurple; font: size 200px;  "   >  Ketelin  </p>
  <p id=" cachorro ">  Lilou  </p>
<p id=  gato ">  Jubileu  </p>

</body>
</html>
